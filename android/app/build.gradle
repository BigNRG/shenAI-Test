plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

static String javaStringLiteral(String value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// API key lookup order: -PshenaiApiKey, SHENAI_API_KEY env var, local.properties (shenai.apiKey).
// It is optional at build time: the key can also be entered in the app.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def shenaiApiKey = (findProperty("shenaiApiKey")
        ?: System.getenv("SHENAI_API_KEY")
        ?: localProps.getProperty("shenai.apiKey")
        ?: "").toString()

android {
    namespace "com.shenai.test"
    compileSdk 35

    defaultConfig {
        applicationId "com.shenai.test"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SHENAI_API_KEY", javaStringLiteral(shenaiApiKey)
        buildConfigField "String", "SHENAI_SDK_VERSION", javaStringLiteral(project.property("shenaiSdkVersion").toString())
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Signed with the debug key so a release build can be side-loaded for testing.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "ai.shen:shenai-sdk:${project.property("shenaiSdkVersion")}"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.core:core-ktx:1.13.1"
}
